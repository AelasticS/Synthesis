name: Deploy Docs

# Triggered manually only — run via GitHub UI: Actions → Deploy Docs → Run workflow.
#
# Builds the Docusaurus site in this repo (AelasticS/Synthesis) and publishes it
# to the gh-pages branch of AelasticS/aelastics, which serves it at
# https://AelasticS.github.io/aelastics/.
#
# Prerequisites:
#   1. Create a Personal Access Token (classic) with `repo` scope, or a
#      fine-grained PAT with Contents: Read & Write on AelasticS/aelastics.
#   2. Add it as a secret named DOCS_DEPLOY_TOKEN in this repo:
#      Settings → Secrets and variables → Actions → New repository secret.
#   3. On AelasticS/aelastics: Settings → Pages → Source = "Deploy from a branch",
#      Branch = gh-pages, Folder = / (root).
on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rush
        run: node common/scripts/install-run-rush.js install

      - name: Build libraries
        run: |
          node common/scripts/install-run-rush.js build --to aelastics-result
          node common/scripts/install-run-rush.js build --to aelastics-types
          node common/scripts/install-run-rush.js build --to aelastics-store

      - name: Build docs
        working-directory: apps/docs
        run: node ../../common/scripts/install-run-rushx.js build

      - name: Publish to AelasticS/aelastics gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.DOCS_DEPLOY_TOKEN }}
          external_repository: AelasticS/aelastics
          publish_branch: gh-pages
          publish_dir: apps/docs/build
          commit_message: "deploy: ${{ github.sha }}"
