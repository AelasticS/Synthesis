name: Deploy Docs

# Triggered manually only — run via GitHub UI: Actions → Deploy Docs → Run workflow.
#
# Builds the Docusaurus site in this repo (AelasticS/Synthesis) and publishes it
# with GitHub Pages from this same repo, which serves it at
# https://AelasticS.github.io/Synthesis/.
#
# Prerequisite (once): Settings → Pages → Build and deployment →
# Source = "GitHub Actions". No token or secret is needed.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # rush.json requires Node >= 22 (nodeSupportedVersionRange)
          node-version: '22'

      - name: Install Rush
        run: node common/scripts/install-run-rush.js install

      - name: Build libraries
        run: |
          node common/scripts/install-run-rush.js build --to @aelastics/result --to @aelastics/types --to @aelastics/store

      - name: Build docs
        working-directory: apps/docs
        run: node ../../common/scripts/install-run-rushx.js build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
