name: Deploy Docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rush
        run: node common/scripts/install-run-rush.js install

      - name: Build libraries
        run: |
          node common/scripts/install-run-rush.js build --to aelastics-result
          node common/scripts/install-run-rush.js build --to aelastics-types
          node common/scripts/install-run-rush.js build --to aelastics-store

      - name: Build docs
        working-directory: apps/docs
        run: node ../../common/scripts/install-run-rushx.js build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
