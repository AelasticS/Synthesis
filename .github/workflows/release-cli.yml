name: Release CLI

# Triggered either manually (workflow_dispatch) or by pushing a tag of the
# form `cli-vX.Y.Z`. Builds the CLI, packs platform tarballs with oclif,
# and attaches them to a GitHub Release named after the tag.
#
# Each platform bundle is packed and smoke-tested on a runner of its own
# platform. oclif installs the dependencies once on the build machine,
# and esbuild ships a native binary per platform, so a bundle packed on
# another platform would carry the wrong esbuild.
#
# A manual run without a tag is a dry run: it packs and smoke-tests the
# selected branch, keeps the tarballs as run artifacts and creates no
# release.
#
# The release workflow does NOT publish anything to npm. It produces
# self-contained tarballs (each bundling Node.js + the CLI + all
# transitive workspace deps) for users to download from GitHub Releases.
#
# Prerequisites:
#   - Repository must allow Actions to create releases (Settings →
#     Actions → General → Workflow permissions = Read and write).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. cli-v0.4.1). Must already exist. Leave empty for a dry run of the selected branch.'
        required: false
  push:
    tags:
      - 'cli-v*'

jobs:
  pack:
    name: pack ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: darwin-x64
            runner: macos-15-intel
          - target: darwin-arm64
            runner: macos-latest
          - target: win32-x64
            runner: windows-latest
    # bash on every runner. On Windows that is Git Bash, whose GNU tar
    # accepts the --force-local flag oclif passes there.
    defaults:
      run:
        shell: bash
    env:
      # Silence the oclif tool's self-update notice; it lands on stderr,
      # which Rush would otherwise report as a build warning.
      OCLIF_SKIP_NEW_VERSION_CHECK: "1"
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "ref=refs/tags/${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$GITHUB_REF" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout (at tag)
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # oclif extracts the Windows Node.js download with 7-Zip
      - name: Put 7-Zip on PATH
        if: runner.os == 'Windows'
        run: echo 'C:\Program Files\7-Zip' >> "$GITHUB_PATH"

      - name: Install Rush
        run: node common/scripts/install-run-rush.js install

      # The examples ship in the bundle under synth/examples/
      - name: Build CLI, examples and their dependencies
        run: node common/scripts/install-run-rush.js build --to @aelastics/synthesis-cli --to path:examples

      - name: Pack the platform tarball
        working-directory: apps/cli
        run: node config/pack-tarballs.mjs --targets ${{ matrix.target }}

      - name: Smoke-test the tarball
        working-directory: apps/cli
        run: node config/smoke-bundle.mjs --target ${{ matrix.target }}

      - name: Upload the tarball
        uses: actions/upload-artifact@v4
        with:
          name: synth-${{ matrix.target }}
          path: apps/cli/dist/synth-v*-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  release:
    needs: pack
    if: github.event_name == 'push' || github.event.inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the tarballs
        uses: actions/download-artifact@v4
        with:
          pattern: synth-*
          path: dist
          merge-multiple: true

      - name: List the tarballs
        run: ls -lh dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/synth-v*-linux-x64.tar.gz
            dist/synth-v*-linux-arm64.tar.gz
            dist/synth-v*-darwin-x64.tar.gz
            dist/synth-v*-darwin-arm64.tar.gz
            dist/synth-v*-win32-x64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
